<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Export Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="export-modal">
        <h2>Download</h2>

        <div class="form-group">
            <label for="file-type" class="label-title">File type</label>
            <select id="file-type">
                <option value="png">PNG (Suggested)</option>
                <option value="jpg">JPG</option>
                <option value="pdf">PDF Standard</option>
                <option value="mp4">MP4 Video</option>
                <option value="gif">GIF</option>
            </select>
        </div>


        <div class="form-group toggles-group">
            <div class="toggle-row">
                <label for="transparent-bg">Transparent background</label>

                <input type="checkbox" id="transparent-bg" class="toggle-checkbox">
            </div>

            <div class="toggle-row">
                <label for="save-settings">Save download settings</label>
                <input type="checkbox" id="save-settings" class="toggle-checkbox">
            </div>
        </div>

        <div class="form-group">
            <label class="label-title">Select pages</label>
            <div class="page-selection">
                <input type="radio" id="page-all" name="pages" checked>
                <label for="page-all" class="radio-label">All (2)</label>

                <input type="radio" id="page-current" name="pages">
                <label for="page-current" class="radio-label">Current page</label>
            </div>
        </div>

        <button id="download-btn">Download</button>

        <div id="status-message" class="hidden" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
